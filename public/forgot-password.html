<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScoutHook — Forgot password</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/signup.css" />
</head>
<body class="signup-page">

  <div class="su-stack">
    <img src="/images/scout-hook-logo.png" alt="ScoutHook" class="su-logo" />

    <div class="su-card" role="region" aria-label="Forgot password">
      <h1 class="su-headline">Reset your <span class="accent">password</span></h1>
      <p class="su-value">Enter the email address associated with your account and we'll send a reset link.</p>

      <div id="errorBox" class="su-error" hidden></div>

      <form id="fpForm" novalidate>
        <div class="su-field-group">
          <label class="su-field-label" for="fp-email">Email</label>
          <input id="fp-email" type="email" class="su-field-input" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <button type="submit" id="fp-submit" class="su-submit">
          Send reset link
        </button>
      </form>

      <p class="su-signin"><a href="/login.html">Back to sign in</a></p>
    </div>
  </div>

  <script>
  (function () {
    const errorBox = document.getElementById('errorBox');
    function showError(msg) { errorBox.textContent = msg; errorBox.hidden = false; }
    function clearError()   { errorBox.hidden = true; }

    document.getElementById('fpForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();
      const email = document.getElementById('fp-email').value.trim();
      if (!email) return showError('Enter your email address.');

      const btn = document.getElementById('fp-submit');
      btn.disabled    = true;
      btn.textContent = 'Sending…';

      try {
        const res  = await fetch('/auth/forgot-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.redirect) { window.location.href = data.redirect + '&email=' + encodeURIComponent(email); return; }
      } catch {
        showError('Network error. Please check your connection and try again.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Send reset link';
      }
    });
  })();
  </script>

</body>
</html>
