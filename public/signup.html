  <title>ScoutHook — Create account</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet" />

</head>
<body class="signup-page">

  <div class="su-stack">
    <img src="/images/scout-hook-logo.png" alt="ScoutHook" class="su-logo" />

    <div class="su-card" role="region" aria-label="Create account">
      <h1 class="su-headline">Join <span class="accent">ScoutHook</span></h1>
      <p class="su-value">Turn your ideas into LinkedIn posts, in about an hour a week.</p>

      <div id="errorBox" class="su-error" hidden></div>

    <!-- Google sign-up -->
    <a href="/auth/google" class="google-btn">
      <span class="google-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="18" height="18">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.08 1.53 7.48 2.81l5.1-4.9C33.44 4.59 29.17 2.5 24 2.5 14.74 2.5 6.94 7.82 3.1 15.6l6.35 4.93C11.34 14.1 17.14 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.5c0-1.34-.12-2.63-.34-3.88H24v7.34h12.5c-.54 2.9-2.18 5.35-4.64 7.02v5.8h7.5c4.38-4.03 6.74-9.97 6.74-16.28z"/>
          <path fill="#FBBC05" d="M9.45 28.53c-.47-1.4-.74-2.9-.74-4.53s.27-3.13.74-4.53l-6.35-4.93C1.77 17.23 1 20.52 1 24s.77 6.77 2.1 9.46l6.35-4.93z"/>
          <path fill="#34A853" d="M24 45.5c5.17 0 9.5-1.7 12.66-4.62l-7.5-5.8c-2.08 1.4-4.74 2.23-5.16 2.23-6.86 0-12.66-4.6-14.55-11.03l-6.35 4.93C6.94 40.18 14.74 45.5 24 45.5z"/>
          <path fill="none" d="M1 1h46v46H1z"/>
        </svg>
      </span>
      <span>Sign up with Google</span>
    </a>

    <div class="su-divider"><hr /><span>or</span><hr /></div>

    <!-- Email / password sign-up -->
    <form id="signupForm" novalidate>
      <div class="su-field-group">
        <label class="su-field-label" for="su-email">Email</label>
        <input id="su-email" type="email" class="su-field-input" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="su-field-group">
        <label class="su-field-label" for="su-password">Password</label>
        <input id="su-password" type="password" class="su-field-input" placeholder="At least 8 characters" autocomplete="new-password" required />
      </div>

      <button type="submit" id="su-submit" class="su-submit">
        Create account
      </button>
    </form>

    <p class="su-note">No credit card required &middot; Cancel anytime</p>
    <p class="su-meta">
      By continuing you agree to our
      <a href="/terms.html">Terms</a> and
      <a href="/privacy.html">Privacy Policy</a>. Need help? <a href="https://app.scouthook.com/help.html" target="_blank" rel="noopener">Visit our help center</a>.
    </p>

      <p class="su-signin">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

  <script>
  (function () {
    // Same reset as login.html: signing up from a tab that was signed in as
    // someone else must not leave that account's cached plan/workspaces behind
    // for the new account to read. Verification finishes with a server-side
    // redirect straight into the app, so there is no later point to clear it.
    try {
      Object.keys(sessionStorage)
        .filter(k => k.startsWith('cf:'))
        .forEach(k => sessionStorage.removeItem(k));
      localStorage.removeItem('scouthook_uid');
      localStorage.removeItem('scouthook_tid');
      localStorage.removeItem('scouthook_session');
      localStorage.removeItem('trial_banner_dismissed');
    } catch { /* storage unavailable — nothing to clear */ }

    const errorBox = document.getElementById('errorBox');

    // Show URL-based error params (e.g. from OAuth redirect)
    const params = new URLSearchParams(window.location.search);
    const urlError = params.get('error');
    if (urlError) {
      const msg =
        urlError === 'google_not_configured' ? 'Google sign-in is not configured on the server.' :
        urlError === 'oauth_failed'          ? 'Google sign-in failed. Please try again.' :
                                               'Sign-in error. Please try again.';
      errorBox.textContent = msg;
      errorBox.hidden = false;
    }

    function showError(msg) { errorBox.innerHTML = msg; errorBox.hidden = false; }
    function clearError()   { errorBox.hidden = true; }

    const ERROR_MESSAGES = {
      invalid_email:            'Enter a valid email address.',
      password_too_short:       'Password must be at least 8 characters.',
      email_already_registered: 'This email is already registered. Try <a href="/login.html">signing in</a>.',
      signup_failed:            'Sign up failed. Please try again.',
    };

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();

      const email    = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-password').value;

      if (!email)               return showError('Enter a valid email address.');
      if (password.length < 8)  return showError('Password must be at least 8 characters.');

      const btn = document.getElementById('su-submit');
      btn.disabled    = true;
      btn.textContent = 'Creating account…';

      try {
        const res  = await fetch('/auth/signup', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.ok && data.redirect) {
          window.location.href = data.redirect;
          return;
        }

        const rawMsg = ERROR_MESSAGES[data.error] || data.error || 'Sign up failed. Please try again.';
        showError(rawMsg);
      } catch {
        showError('Network error. Please check your connection and try again.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Create account';
      }
    });
  })();
  </script>

</body>
</html>
